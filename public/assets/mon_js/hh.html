<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Impression HTML en PDF</title>

        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/print.js/1.6.2/print.min.css">
    </head>
    <body>
        <div id="htmlContent">
            <h1>Rapport Personnalisé</h1>
            <p>Ceci est un exemple de contenu HTML à convertir en PDF.</p>
            <ul>
                <li>Point 1</li>
                <li>Point 2</li>
                <li>Point 3</li>
            </ul>
        </div>
        <button onclick="exportToPDF()">Exporter en PDF</button>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/print.js/1.6.2/print.min.js"></script>
        <script>
        function exportToPDF() {
            printJS({
                printable: 'htmlContent',
                type: 'html',
                targetStyles: ['*'],
                header: 'Rapport Personnalisé',
            });
        }
    </script>
        <script>
             function imprimerEDT() {
            printJS({
                printable: 'edt',
                type: 'html',
                targetStyles: ['*'],
                header: 'Emploi du temps - IUFP',
            });
        }
    </script>
    </body>
</html>
